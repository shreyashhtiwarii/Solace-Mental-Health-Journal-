<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Solace — Mental Health Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- Custom Cursor -->
<div id="cursor-outer"></div>
<div id="cursor-inner"></div>

<!-- Three.js Canvas -->
<canvas id="three-canvas"></canvas>

<!-- 3D Depth Scene -->
<div class="scene" id="scene">
  <div class="depth-layer" id="dl1">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
    <!-- Floating crystals -->
    <div class="float-crystal" style="top:15%;left:8%;--dur:14s;--delay:-3s;--op:.12">
      <svg width="28" height="32" viewBox="0 0 28 32"><polygon points="14,0 28,10 24,28 4,28 0,10" fill="none" stroke="#6DBAAA" stroke-width="1"/></svg>
    </div>
    <div class="float-crystal" style="top:60%;right:10%;--dur:18s;--delay:-8s;--op:.1">
      <svg width="22" height="26" viewBox="0 0 22 26"><polygon points="11,0 22,8 18,22 4,22 0,8" fill="none" stroke="#4ECDC4" stroke-width="1"/></svg>
    </div>
    <div class="float-crystal" style="top:35%;left:75%;--dur:11s;--delay:-5s;--op:.08">
      <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="3" width="12" height="12" fill="none" stroke="#9B94C8" stroke-width="1" transform="rotate(45 9 9)"/></svg>
    </div>
    <div class="float-crystal" style="top:80%;left:20%;--dur:16s;--delay:-11s;--op:.09">
      <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="12,1 15,9 23,9 17,14 19,22 12,17 5,22 7,14 1,9 9,9" fill="none" stroke="#6DBAAA" stroke-width="1"/></svg>
    </div>
  </div>
</div>

<div class="noise"></div>

<!-- App Shell -->
<div class="shell">

  <!-- Header -->
  <header class="header">
    <div class="logo-row">
      <div class="logo-gem">🌿</div>
      <div>
        <div class="logo-name">Solace</div>
        <div class="logo-sub">Mental Health Journal</div>
      </div>
    </div>
    <div class="header-pills">
      <div class="pill amber" id="streakPill">🔥 <span id="streakVal">—</span> day streak</div>
      <div class="pill" id="hdrDate"></div>
      <div class="pill" id="userProfile" style="display:none; cursor:pointer; background:rgba(109,186,170,0.15); border-color:rgba(109,186,170,0.3)" onclick="logout()">
        👤 <span id="userName" style="font-weight:500; margin:0 4px">User</span>
        <span style="opacity:0.6; font-size:10px; margin-left:6px; text-transform:uppercase; letter-spacing:1px">Logout</span>
      </div>
    </div>
  </header>

  <!-- Nav -->
  <nav class="nav">
    <button class="tab active" data-view="journal"  onclick="gv('journal')"><span class="tab-icon">✍️</span> Journal</button>
    <button class="tab"        data-view="insights" onclick="gv('insights')"><span class="tab-icon">📊</span> Insights</button>
    <button class="tab"        data-view="history"  onclick="gv('history')"><span class="tab-icon">📅</span> History <span class="tab-ct" id="hct">—</span></button>
  </nav>

  <!-- Main -->
  <main class="main" id="app"></main>

  <footer class="footer">
    If you're in crisis please reach out — India: <a href="tel:9152987821">iCall 9152987821</a> &nbsp;·&nbsp; Global: <a href="https://befrienders.org" target="_blank">befrienders.org</a>
  </footer>
</div>

<div id="toast"><span id="ti">🌿</span><span id="tm"></span></div>

<!-- THREE.JS CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="js/app.js"></script>
</body>
</html>
